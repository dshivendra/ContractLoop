name: Codex Ship

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (same repository, targeting main)
        required: true
        type: string
      head_sha:
        description: Exact current 40-character PR head SHA
        required: true
        type: string
      mode:
        description: Review or propose one bounded repair
        type: choice
        options: [review, fix]
        default: review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-ship-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  codex:
    # Automatic paid reviews are opt-in. Forks and bot loops are excluded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CODEX_SHIP_ENABLED == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Verify credential availability
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo 'Configure the OPENAI_API_KEY repository secret for background Codex runs. No Claude account is needed.' >&2
            exit 1
          fi
      - name: Resolve and bind current pull request
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: >-
          python control/.github/codex/ship.py prepare
          --policy control/.github/codex/policy.json
          --receipt "$RUNNER_TEMP/repair.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.context.outputs.head }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare trusted instructions
        env:
          BASE_SHA: ${{ steps.context.outputs.base }}
          HEAD_SHA: ${{ steps.context.outputs.head }}
          SHIP_MODE: ${{ inputs.mode || 'review' }}
        run: |
          case "$SHIP_MODE" in review|fix) ;; *) echo 'Invalid mode' >&2; exit 1 ;; esac
          cp "control/.github/codex/$SHIP_MODE.md" "$RUNNER_TEMP/prompt.md"
          printf '\nCompare base %s with candidate HEAD %s.\n' "$BASE_SHA" "$HEAD_SHA" >> "$RUNNER_TEMP/prompt.md"
          cp control/.github/codex/review.schema.json "$RUNNER_TEMP/review.schema.json"
      - name: Codex review or bounded repair
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ${{ inputs.mode == 'fix' && ':workspace' || ':read-only' }}
          safety-strategy: drop-sudo
          working-directory: candidate
          prompt-file: ${{ runner.temp }}/prompt.md
          output-schema-file: ${{ runner.temp }}/review.schema.json
          output-file: ${{ runner.temp }}/review.json
      - name: Export repair through deterministic scope checks
        if: ${{ inputs.mode == 'fix' }}
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: >-
          python control/.github/codex/ship.py export
          --root candidate --policy control/.github/codex/policy.json
          --receipt "$RUNNER_TEMP/repair.json"
      - name: Save review and proposed repair
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-proposal
          path: |
            ${{ runner.temp }}/review.json
            ${{ runner.temp }}/repair.json
          if-no-files-found: error
          retention-days: 14

  validate_repair:
    if: ${{ inputs.mode == 'fix' }}
    needs: codex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-proposal
          path: proposal
      - name: Read validated candidate identity
        id: proposal
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          p=json.loads(Path('proposal/repair.json').read_text())
          if not isinstance(p,dict) or not re.fullmatch(r'[0-9a-f]{40}',p.get('head_sha','')):
              raise SystemExit('No valid repair receipt')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('head='+p['head_sha']+'\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.proposal.outputs.head }}
          path: candidate
          persist-credentials: false
      - name: Apply only scope-checked repair files
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: >-
          python control/.github/codex/ship.py apply --root candidate
          --policy control/.github/codex/policy.json --receipt proposal/repair.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Independently verify proposed code with original tests
        working-directory: candidate/verification-control-plane
        run: |
          python -m pip install -e '.[qa]'
          python tools/run_acceptance.py --output "$RUNNER_TEMP/repair-evidence"
          python -m vcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: codex-repair-evidence
          path: ${{ runner.temp }}/repair-evidence/
          if-no-files-found: error
          retention-days: 14

  propose_repair:
    if: ${{ inputs.mode == 'fix' }}
    needs: validate_repair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-proposal
          path: proposal
      - name: Open separate draft repair PR after independent verification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: >-
          python .github/codex/ship.py publish --policy .github/codex/policy.json
          --receipt proposal/repair.json
