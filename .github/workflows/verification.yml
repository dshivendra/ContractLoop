name: ContractLoop verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Phase 1 gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: verification-control-plane
        shell: bash
    steps:
      - name: Check out candidate merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install kernel and QA dependencies
        run: python -m pip install -e '.[qa]'
      - name: Run tests, schema checks, replay and mutation acceptance
        run: python tools/run_acceptance.py --output "$RUNNER_TEMP/contractloop-evidence"
      - name: Exercise the legacy integration demo
        run: python -m vcp
      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-evidence-python-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contractloop-evidence/
          if-no-files-found: error
          retention-days: 14
